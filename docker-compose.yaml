name: bionicpro-task1

services:
  keycloak_db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/prepare-local.py}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [identity]
  profile_db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: profiles
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?Run scripts/prepare-local.py}
    volumes:
      - profile-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U profiles]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [profiles]
  ldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: BionicPRO regional office
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Run scripts/prepare-local.py}
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: localhost.crt
      LDAP_TLS_KEY_FILENAME: localhost.key
      LDAP_TLS_CA_CRT_FILENAME: localhost.crt
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
      - ./.local/tls:/container/service/slapd/assets/certs:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks: [identity]
  keycloak:
    build: ./keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/prepare-local.py}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_ORIGIN:-https://localhost:3443}/identity
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores/localhost.crt
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?Run scripts/prepare-local.py}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:3443}
      YANDEX_ENABLED: ${YANDEX_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-not-configured}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-not-configured}
    command: [start, --import-realm]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/reports-realm-realm.json:ro
      - ./.local/tls/localhost.crt:/opt/keycloak/conf/truststores/localhost.crt:ro
    depends_on:
      keycloak_db:
        condition: service_healthy
      ldap:
        condition: service_started
    networks: [edge, identity]
  bionicpro-auth:
    build: ./bionicpro-auth
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:3443}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Run scripts/prepare-local.py}
      PROFILE_DATABASE_URL: postgresql://profiles:${PROFILE_DB_PASSWORD}@profile_db:5432/profiles
      YANDEX_ENABLED: ${YANDEX_ENABLED:-false}
    depends_on:
      profile_db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, profiles]
  frontend:
    build: ./frontend
    networks: [edge]
  gateway:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:3443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/tls:/etc/nginx/tls:ro
    depends_on:
      frontend:
        condition: service_started
      bionicpro-auth:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks: [edge]

volumes:
  keycloak-data:
  profile-data:
  ldap-data:
  ldap-config:
networks:
  edge:
  identity:
    internal: true
  profiles:
    internal: true
