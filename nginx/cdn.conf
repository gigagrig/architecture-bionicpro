proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports:10m
                 max_size=256m inactive=24h use_temp_path=off;
log_format safe_cdn '$remote_addr $request_method $uri $status $upstream_cache_status';
server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log safe_cdn;
    # Resolve the trusted, internally signed S3 origin supplied by Go.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/cdn/reports/v1/ {
        limit_except GET { deny all; }
        auth_request /_authorize;
        auth_request_set $origin $upstream_http_x_report_origin;
        auth_request_set $session_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $session_cookie always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Report-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        proxy_cache reports;
        # Immutable paths contain owner, period and ETL version. Signing queries
        # and rotating cookies must not create new cached copies.
        proxy_cache_key $uri;
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host minio:9000;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_pass $origin;
    }
    location = /_authorize {
        internal;
        proxy_pass http://bionicpro-auth:8000/internal/report-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /health { access_log off; return 200 'ok'; }
    location / { return 404; }
}
