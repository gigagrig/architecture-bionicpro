limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Do not record authorization codes, session cookies, or Yandex tokens.
log_format safe '$remote_addr $request_method $uri $status';
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log safe;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 16k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 3443;
    proxy_set_header X-Forwarded-For $remote_addr;
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://bionicpro-auth:8000;
    }
    location /auth/ { proxy_pass http://bionicpro-auth:8000; }
    location /api/ { proxy_pass http://bionicpro-auth:8000; }
    location = /reports { proxy_pass http://bionicpro-auth:8000; }
    location /cdn/ { proxy_pass http://cdn:8080; }
    location /internal/ { return 404; }
    location /identity/ { proxy_pass http://keycloak:8080; }
    location / { proxy_pass http://frontend:3000; }
}
